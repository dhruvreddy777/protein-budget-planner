<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ProteinBudget{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
</head>
<body>
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="/">
                <span class="brand-mark">P</span>
                <span>Protein<em>Budget</em></span>
            </a>
            <nav class="nav-links">
                <a href="/" class="{% if active == 'planner' %}is-active{% endif %}">Planner</a>
                <a href="/recipes" class="{% if active == 'recipes' %}is-active{% endif %}">Recipes</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p><strong>ProteinBudget</strong>: high-protein eating on a real-world budget.</p>
            <p class="muted">Prices compared across Coles &amp; Aldi, Sydney. Protein values are indicative estimates.</p>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
